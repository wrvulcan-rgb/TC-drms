<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E⛺%3C/text%3E%3C/svg%3E">
<title>安身｜慈濟大型災害收容安置管理系統（演示原型）</title>
<style>
/* ============ 設計 tokens（雙主題）============ */
:root{
  --navy:#1E4066; --navy-deep:#16334F; --navy-ink:#123; --on-navy:#F4F7FB;
  --wood:#8A6B45;
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#E9EDF3; --surface3:#DFE5EE;
  --ink:#1C2736; --ink2:#4E5E74; --ink3:#7C8AA0; --border:#D8DFE9; --border2:#C4CEDC;
  --ok:#2E7D4F; --ok-bg:#E3F1E9; --warn:#B45309; --warn-bg:#F7ECDC; --crit:#B3372B; --crit-bg:#F8E7E4; --info-bg:#E6EDF6;
  --c1:#3A6FB0; --c2:#C07A2E; --c3:#3E8E5C; --c4:#9061C2;
  --shadow:0 1px 3px rgba(20,35,60,.08),0 4px 14px rgba(20,35,60,.06);
  --shadow-lg:0 6px 28px rgba(15,25,45,.18);
  --r:10px; --r-sm:6px;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --focus:0 0 0 3px rgba(58,111,176,.35);
}
@media (prefers-color-scheme: dark){
  :root{
    --navy:#2E5A8F; --navy-deep:#254a77; --on-navy:#EAF1F9; --wood:#C9A87A;
    --bg:#0F1621; --surface:#182231; --surface2:#1F2C3F; --surface3:#26354B;
    --ink:#E9EEF5; --ink2:#A6B4C8; --ink3:#71809A; --border:#2A3A52; --border2:#38496399;
    --ok:#5BBF8A; --ok-bg:#1B3327; --warn:#E8A33D; --warn-bg:#3A2C14; --crit:#E36B5C; --crit-bg:#3B1F1B; --info-bg:#1D2E44;
    --c1:#5C8FC7; --c2:#CE7F2B; --c3:#55A377; --c4:#A97FD1;
    --shadow:0 1px 3px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.28);
    --shadow-lg:0 8px 32px rgba(0,0,0,.5);
    --focus:0 0 0 3px rgba(92,143,199,.45);
  }
}
:root[data-theme="light"]{
  --navy:#1E4066; --navy-deep:#16334F; --on-navy:#F4F7FB; --wood:#8A6B45;
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#E9EDF3; --surface3:#DFE5EE;
  --ink:#1C2736; --ink2:#4E5E74; --ink3:#7C8AA0; --border:#D8DFE9; --border2:#C4CEDC;
  --ok:#2E7D4F; --ok-bg:#E3F1E9; --warn:#B45309; --warn-bg:#F7ECDC; --crit:#B3372B; --crit-bg:#F8E7E4; --info-bg:#E6EDF6;
  --c1:#3A6FB0; --c2:#C07A2E; --c3:#3E8E5C; --c4:#9061C2;
  --shadow:0 1px 3px rgba(20,35,60,.08),0 4px 14px rgba(20,35,60,.06);
  --shadow-lg:0 6px 28px rgba(15,25,45,.18);
  --focus:0 0 0 3px rgba(58,111,176,.35);
}
:root[data-theme="dark"]{
  --navy:#2E5A8F; --navy-deep:#254a77; --on-navy:#EAF1F9; --wood:#C9A87A;
  --bg:#0F1621; --surface:#182231; --surface2:#1F2C3F; --surface3:#26354B;
  --ink:#E9EEF5; --ink2:#A6B4C8; --ink3:#71809A; --border:#2A3A52; --border2:#38496399;
  --ok:#5BBF8A; --ok-bg:#1B3327; --warn:#E8A33D; --warn-bg:#3A2C14; --crit:#E36B5C; --crit-bg:#3B1F1B; --info-bg:#1D2E44;
  --c1:#5C8FC7; --c2:#CE7F2B; --c3:#55A377; --c4:#A97FD1;
  --shadow:0 1px 3px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.28);
  --shadow-lg:0 8px 32px rgba(0,0,0,.5);
  --focus:0 0 0 3px rgba(92,143,199,.45);
}
/* ============ 基底 ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:is(button,select,input,textarea,a,[tabindex]):focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-sm)}
img,svg{max-width:100%}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ============ 版面骨架 ============ */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.sidebar{background:var(--navy-deep);color:var(--on-navy);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;gap:8px;padding:2px 8px}
.brand .zh{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.14em}
.brand .en{font-size:10px;letter-spacing:.12em;opacity:.66;text-transform:uppercase}
.brand-sub{font-size:11px;opacity:.62;padding:0 8px;letter-spacing:.05em}
.side-nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.side-nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;color:var(--on-navy);opacity:.78;font-size:14px}
.side-nav button:hover{background:rgba(255,255,255,.09);opacity:1}
.side-nav button.on{background:rgba(255,255,255,.16);opacity:1;font-weight:600}
.side-nav .nicon{width:20px;text-align:center;flex:none}
.side-nav .badge{margin-left:auto;background:var(--crit);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;font-size:11px;opacity:.55;padding:0 8px;line-height:1.7}
/* 頂列（行動版） */
.topbar{display:none;position:sticky;top:0;z-index:40;background:var(--navy-deep);color:var(--on-navy);padding:10px 12px 0;box-shadow:var(--shadow)}
.topbar-row{display:flex;align-items:center;gap:10px}
.topbar .zh{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.12em}
.tab-rail{display:flex;gap:2px;overflow-x:auto;padding:8px 2px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-rail::-webkit-scrollbar{display:none}
.tab-rail button{flex:none;padding:8px 12px 10px;color:var(--on-navy);opacity:.75;font-size:13.5px;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:5px}
.tab-rail button.on{opacity:1;font-weight:600;border-bottom-color:var(--on-navy)}
.tab-rail .badge{background:var(--crit);color:#fff;font-size:10px;border-radius:99px;padding:0 6px;font-variant-numeric:tabular-nums}
/* 主內容 */
.main{min-width:0;padding:0 26px 60px}
.event-strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);margin:0 -26px;padding:11px 26px;position:sticky;top:0;z-index:30}
.event-strip .ev-name{font-weight:700;font-size:14px}
.event-strip .lv{font-size:12px;background:var(--crit-bg);color:var(--crit);border-radius:99px;padding:2px 10px;font-weight:600}
.event-strip .spacer{flex:1}
.content{max-width:1180px;margin:0 auto}
.page-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:26px 0 4px}
.page-head h1{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:.06em}
.page-head .sub{color:var(--ink3);font-size:13px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-top:22px}
/* ============ 元件 ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h3{font-size:14px;color:var(--ink2);font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font-size:12px;color:var(--c1);font-weight:500}
.grid{display:grid;gap:14px;margin:14px 0}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.gauto{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12.5px;color:var(--ink3)}
.stat .v{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .v small{font-size:13px;font-weight:500;color:var(--ink3);margin-left:3px}
.stat .d{font-size:12px;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:99px;padding:2.5px 10px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)}
.chip.info{background:var(--info-bg);color:var(--c1)}
.chip.mut{background:var(--surface2);color:var(--ink2)}
.chip.wood{background:transparent;color:var(--wood);border:1px solid var(--wood)}
.dot{width:8px;height:8px;border-radius:99px;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}.dot.mut{background:var(--ink3)}
/* 燈號警示列 */
.alert-strip{display:flex;gap:10px;overflow-x:auto;padding:2px;margin:16px 0 0;scrollbar-width:none}
.alert-strip::-webkit-scrollbar{display:none}
.signal{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--ink3);border-radius:var(--r-sm);padding:10px 13px;box-shadow:var(--shadow)}
.signal.crit{border-left-color:var(--crit)}.signal.warn{border-left-color:var(--warn)}.signal.ok{border-left-color:var(--ok)}
.signal .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.signal .t{font-size:12px;color:var(--ink2);line-height:1.35}
/* 按鈕 */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:8px;font-size:13.5px;font-weight:600;border:1px solid transparent;transition:filter .12s}
.btn:hover{filter:brightness(1.06)}
.btn.pri{background:var(--navy);color:var(--on-navy)}
.btn.sec{background:var(--surface);border-color:var(--border2);color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.crit-o{background:transparent;border-color:var(--crit);color:var(--crit)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn.locked{opacity:.55;position:relative}
.btn.locked::after{content:"🔒";font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* 表格 */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:12px;color:var(--ink3);font-weight:600;text-align:left;letter-spacing:.04em;white-space:nowrap}
th,td{padding:9px 12px;border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* 容量量表 */
.meter{height:8px;background:var(--surface3);border-radius:99px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--c1);border-radius:99px;transition:width .3s}
.meter.warn i{background:var(--warn)}.meter.crit i{background:var(--crit)}
.meter-row{display:flex;align-items:center;gap:10px}
.meter-row .lab{font-size:12.5px;color:var(--ink2);width:110px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter-row .val{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink2);width:72px;text-align:right;flex:none}
/* 小型長條圖 */
.bars{display:flex;align-items:flex-end;gap:2px;height:88px;padding-top:6px}
.bars .bar{flex:1;background:var(--c1);border-radius:4px 4px 0 0;min-height:3px;position:relative}
.bars .bar.b2{background:var(--c2)}.bars .bar.b3{background:var(--c3)}.bars .bar.b4{background:var(--c4)}
.bar .bl{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.bars-x{display:flex;gap:2px;margin-top:5px}
.bars-x span{flex:1;text-align:center;font-size:11px;color:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* 表單 */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.field>label{font-size:12.5px;color:var(--ink2);font-weight:600}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--border2);border-radius:7px;padding:8px 10px;font-size:14px;width:100%}
.field .hint{font-size:11.5px;color:var(--ink3)}
.field.err input,.field.err select{border-color:var(--crit)}
.field .errmsg{font-size:12px;color:var(--crit)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
fieldset{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:12px}
legend{font-size:12px;color:var(--ink3);padding:0 6px;letter-spacing:.05em}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.checks label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
/* 步驟條 */
.steps{display:flex;gap:0;margin:14px 0 20px;overflow-x:auto}
.step{flex:1;min-width:86px;text-align:center;position:relative;font-size:12px;color:var(--ink3);padding-top:26px}
.step::before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:99px;background:var(--surface3);color:var(--ink2);font-size:11.5px;line-height:22px;font-weight:700}
.step::after{content:"";position:absolute;top:11px;left:calc(50% + 14px);width:calc(100% - 28px);height:2px;background:var(--surface3)}
.step:last-child::after{display:none}
.step.on{color:var(--ink);font-weight:600}
.step.on::before{background:var(--navy);color:var(--on-navy)}
.step.done{color:var(--ok)}
.step.done::before{background:var(--ok);color:#fff;content:"✓"}
.step.done::after{background:var(--ok)}
/* 清單卡 */
.item-list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow)}
.item .row1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.item .ttl{font-weight:700;font-size:14.5px}
.item .meta{font-size:12.5px;color:var(--ink3);margin-top:3px;line-height:1.6}
.item .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.item .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* 時間線 */
.tl{list-style:none;position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl li{position:relative;padding:0 0 12px 12px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:99px;background:var(--c1);outline:3px solid var(--surface)}
.tl .t{color:var(--ink3);font-size:11.5px;font-variant-numeric:tabular-nums}
/* Modal / Toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,18,30,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px}
.modal h2{font-family:var(--serif);font-size:19px;margin-bottom:4px;letter-spacing:.04em}
.modal .msub{font-size:12.5px;color:var(--ink3);margin-bottom:14px}
.modal .macts{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;width:min(420px,92vw)}
.toast{background:var(--ink);color:var(--bg);border-radius:9px;padding:10px 15px;font-size:13.5px;box-shadow:var(--shadow-lg);display:flex;gap:9px;align-items:flex-start;animation:tin .25s ease}
.toast.crit{background:var(--crit);color:#fff}.toast.ok{background:var(--ok);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* 連動摘要（money shot） */
.ripple-house{text-align:center;padding:14px 10px 6px}
.ripple-house .hh{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:.05em}
.ripple-house .hs{font-size:12.5px;color:var(--ink3);margin-top:3px}
.ripple-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.bubble{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 8px;text-align:center;opacity:0;transform:scale(.7);animation:pop .38s cubic-bezier(.2,1.4,.4,1) forwards}
.bubble .bi{font-size:17px}
.bubble .bv{font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.bubble .bk{font-size:11px;color:var(--ink2);margin-top:2px;line-height:1.4}
.bubble.up .bv{color:var(--c1)}.bubble.down .bv{color:var(--warn)}.bubble.alert{border-color:var(--crit)}.bubble.alert .bv{color:var(--crit)}
@keyframes pop{to{opacity:1;transform:none}}
/* 制度說明（三流圖解） */
.flow-box{border:1px solid var(--border);border-radius:var(--r);padding:16px;background:var(--surface);margin:12px 0;overflow-x:auto}
.flow-line{display:flex;align-items:stretch;gap:0;min-width:560px}
.fnode{flex:1;border:1.5px solid var(--border2);border-radius:9px;padding:9px 8px;text-align:center;background:var(--surface2);position:relative;min-width:76px}
.fnode b{display:block;font-size:13px}
.fnode span{font-size:11px;color:var(--ink3);display:block;margin-top:2px;line-height:1.4}
.fnode.hot{border-color:var(--navy);background:var(--info-bg)}
.fnode.okn{border-color:var(--ok);background:var(--ok-bg)}
.farr{flex:none;display:flex;align-items:center;padding:0 5px;color:var(--ink3);font-size:15px}
.fnote{font-size:12px;color:var(--ink3);margin-top:8px;line-height:1.7}
.matrix-wrap{overflow-x:auto}
.matrix{border-collapse:collapse;font-size:12px;min-width:660px}
.matrix th,.matrix td{border:1px solid var(--border);padding:6px 8px;text-align:center}
.matrix th{background:var(--surface2);font-size:11.5px}
.matrix td.y{background:var(--ok-bg);color:var(--ok);font-weight:700}
.matrix td.p{background:var(--warn-bg);color:var(--warn);font-weight:700}
.matrix td.n{color:var(--ink3)}
.matrix td.rl{text-align:left;font-weight:600;background:var(--surface2);white-space:nowrap}
/* 燈箱式核取清單 */
.check-list{list-style:none;display:flex;flex-direction:column;gap:7px}
.check-list li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px}
.check-list .cbx{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border2);display:grid;place-items:center;font-size:12px;margin-top:1px}
.check-list li.done .cbx{background:var(--ok);border-color:var(--ok);color:#fff}
.check-list li.done{color:var(--ink2)}
/* 角色徽章 */
.role-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--on-navy)}
.role-pill select{background:transparent;border:none;color:inherit;font-weight:700;font-size:13px;max-width:130px}
.role-pill select option{color:#1C2736}
.mini-note{font-size:11px;opacity:.6}
/* 空區塊 */
.empty{border:1.5px dashed var(--border2);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--ink3);font-size:13px}
/* 分區色帶 */

/* ---------- 衍生查詢（唯一口徑） ---------- */
const siteOf   = id  => S.sites.find(s => s.id === id);
const spacesOf = sid => S.spaces.filter(p => p.siteId === sid);
const hhIn     = sid => S.households.filter(h => h.siteId === sid && h.status === 'in');
const occSpace = pid => S.households.filter(h => h.spaceId === pid && h.status === 'in')
                          .reduce((n,h) => n + h.members.length, 0);
const occSite  = sid => hhIn(sid).reduce((n,h) => n + h.members.length, 0);
const capSite  = sid => spacesOf(sid).reduce((n,p) => n + (p.cap || 0), 0);
const stockOf  = (sid,iid) => S.stock.find(r => r.siteId === sid && r.itemId === iid);
const stockCls = r => r.qty <= Math.floor(r.safety/2) || r.qty === 0 ? 'crit' : (r.qty < r.safety ? 'warn' : 'ok');
const lowStock = sid => S.stock.filter(r => (!sid || r.siteId === sid) && !ITEM[r.itemId].equip && r.qty < r.safety);
const openSites = () => S.sites.filter(s => s.status === 'open');
const dinnerForecast = sid => occSite(sid) + (siteOf(sid).volunteers || 0);
const dietCounts = sid => {
  const c = {diabetic:0, soft:0, infant:0, allergy:0};
  hhIn(sid).forEach(h => h.members.forEach(m => { if(c[m.diet] !== undefined) c[m.diet]++; }));
  return c;
};
const healthFlagged = sid => hhIn(sid).flatMap(h => h.members.filter(m => m.needs.length).map(m => ({...m, hh:h})));
const followList = () => S.households.filter(h => h.status === 'out' && h.followUp);
const pendingReqsFor = () => {
  if(S.role === 'hq')  return S.reqs.filter(r => r.status === 'pending');
  if(S.role === 'cmd') return S.reqs.filter(r => r.status === 'pending' && !r.cross);
  return [];
};
const todoCount = () => {
  let n = 0;
  if(S.role === 'hq')  n += S.sites.filter(s => s.status === 'applying').length + pendingReqsFor().length;
  if(S.role === 'cmd') n += pendingReqsFor().length;
  if(S.role === 'supply') n += S.reqs.filter(r => r.status === 'approved' || r.status === 'issued').length
                             + S.donations.filter(d => d.status === 'pending').length;
  if(S.role === 'kitchen') n += openSites().filter(s => (S.meals[s.id]||[]).some(m => !m.done && m.planned == null)).length;
  if(S.role === 'care' || S.role === 'med') n += S.careLogs.filter(l => l.followUp).length;
  return n;
};
const tabBadge = t => {
  if(t === 'sites'    && S.role === 'hq') return S.sites.filter(s => s.status === 'applying').length;

};

/* 報到（六處連動 money shot） */
function registerHousehold(d){
  const sid = S.site;
  const sp = S.spaces.find(p => p.id === d.spaceId);
  const n = d.members.length;
  if(n < 1) return {ok:false, msg:'每戶至少需登記 1 位成員'};
  if(!sp || sp.siteId !== sid || !sp.cap) return {ok:false, msg:'請選擇收容分區'};
  if(siteOf(sid).status !== 'open') return {ok:false, msg:'本據點尚未開設，無法收容報到'};
  const remain = sp.cap - occSpace(sp.id);
  if(remain < n) return {ok:false, msg:`「${sp.name}」剩餘 ${remain} 床，不足安置 ${n} 口——請改選其他分區或洽空間組調度`};
  if(d.idm && S.households.some(h => h.status === 'in' && h.idm === d.idm))
    return {ok:false, msg:'此證號已有在住紀錄，禁止重複報到（可至住民清單查詢）'};

  const before = { spOcc: occSpace(sp.id), siteOcc: occSite(sid), dinner: dinnerForecast(sid), audit: S.audit.length };
  const id = 'H' + String(++S.seq).padStart(3,'0');
  const reserved = {}, shortages = [], alerts = [];
  ['bed','blanket','kit'].forEach(iid => {
    const st = stockOf(sid, iid);
    const take = st ? Math.min(n, st.qty) : 0;   // clamp：庫存不得為負
    if(st) st.qty -= take;
    reserved[iid] = take;
    if(take < n) shortages.push({iid, gap: n - take});
  });
  S.households.push({ id, siteId:sid, spaceId:sp.id, head:d.head, idm:d.idm, phone:d.phone,
    addr:d.addr, checkin:nowStr(), status:'in', members:d.members, reserved });
  audit('報到', `報到：${d.head}戶 ${n} 口 → ${sp.name}（${sp.zone}）`, id, sid);
  shortages.forEach(s => audit('警示', `物資缺口：${ITEM[s.iid].name}不足 ${s.gap} ${ITEM[s.iid].unit}，需即刻請領`, id, sid));
  ['bed','blanket','kit'].forEach(iid => {
    const st = stockOf(sid, iid);
    if(st && st.qty < st.safety)
      alerts.push(`${ITEM[iid].name}低於安全庫存（現量 ${st.qty}／安全 ${st.safety}），建議請領 ${st.safety*2 - st.qty} ${ITEM[iid].unit}`);
  });
  const diets = d.members.filter(m => m.diet && m.diet !== 'normal');
  return {ok:true, id, hh:d.head, sp, n, before, reserved, shortages, alerts, diets, sid};
}

/* 退住（反向釋放；床回補、消耗品不回補——預設規則，待 Mason 確認） */
function dischargeHousehold(hhId){
  const hh = S.households.find(h => h.id === hhId);
  if(!hh || hh.status !== 'in'){ toast('該戶已退住，不可重複操作'); return null; }
  const sid = hh.siteId, n = hh.members.length;
  const before = { dinner: dinnerForecast(sid), siteOcc: occSite(sid) };
  hh.status = 'out'; hh.checkout = nowStr();
  hh.followUp = hh.members.some(m => m.needs.length > 0) || S.careLogs.some(l => l.hhId === hhId && l.followUp);
  if(hh.followUp && !hh.followNote) hh.followNote = '退住評估有持續需求，轉社區訪視志工接手關懷';
  const bedBack = hh.reserved?.bed || 0;
  const st = stockOf(sid, 'bed');
  if(st && bedBack) st.qty += bedBack;
  audit('退住', `${hh.head}戶 ${n} 口退住${hh.followUp ? '，轉社區訪視追蹤' : ''}`, hhId, sid);
  return {hh, n, sid, before, bedBack};
}

/* 物資請領工作流：申請 → 核准 → 出庫 → 簽收 */
function createReq(d){
  const id = 'R-' + (++S.seq);
  S.reqs.unshift({ id, siteId:S.site, itemId:d.itemId, qty:d.qty, cross:d.cross, from:d.from,
    reason:d.reason, by:S.role, byName:`${ROLES[S.role].name}（值班）`, at:nowStr(), status:'pending',
    log:[{t:nowStr(), s:'建立申請' + (d.cross ? '（跨據點調撥）' : '')}] });
  audit('請領', `建立請領 ${id}：${ITEM[d.itemId].name} ${d.qty} ${ITEM[d.itemId].unit}${d.cross ? '（跨據點調撥）' : ''}`, id);
  return id;
}
function approveReq(id){
  const r = S.reqs.find(x => x.id === id);
  if(!r || r.status !== 'pending'){ toast('此單已處理，不可重複核准'); return false; }
  if(r.cross && S.role !== 'hq'){
    audit('越權攔截', `遭拒：核准 ${id}——跨據點調撥需「總指揮中心」，現任「${ROLES[S.role].name}」`, id);
    commit();
    toast('⛔ 跨據點調撥需「總指揮中心」核准（已記入稽核）', 'crit');
    return false;
  }
  r.status = 'approved'; r.apprBy = ROLES[S.role].name;
  r.log.push({t:nowStr(), s:`${ROLES[S.role].name}核准`});
  audit('核准', `核准請領 ${id}（${ITEM[r.itemId].name} ${r.qty} ${ITEM[r.itemId].unit}）`, id, r.siteId);
  return true;
}
function rejectReq(id){
  const r = S.reqs.find(x => x.id === id);
  if(!r || r.status !== 'pending'){ toast('此單已處理'); return false; }
  r.status = 'rejected';
  r.log.push({t:nowStr(), s:`${ROLES[S.role].name}駁回`});
  audit('駁回', `駁回請領 ${id}`, id, r.siteId);
  return true;
}
function issueReq(id){
  const r = S.reqs.find(x => x.id === id);
  if(!r || r.status !== 'approved'){ toast('此單不在待出庫狀態'); return false; }
  r.status = 'issued';
  r.log.push({t:nowStr(), s:(r.cross && r.from ? r.from : '總倉') + '出庫，配送中'});
  audit('出庫', `請領 ${id} 出庫（${ITEM[r.itemId].name} ${r.qty} ${ITEM[r.itemId].unit}）`, id, r.siteId);
  return true;
}
function receiveReq(id){
  const r = S.reqs.find(x => x.id === id);
  if(!r || r.status !== 'issued'){ toast('此單尚未出庫或已簽收'); return false; }
  r.status = 'received';
  let st = stockOf(r.siteId, r.itemId);
  if(!st){ st = {siteId:r.siteId, itemId:r.itemId, qty:0, safety:5}; S.stock.push(st); }
  st.qty += r.qty;
  r.log.push({t:nowStr(), s:`${siteOf(r.siteId).short}簽收入庫（庫存 ${st.qty}）`});
  audit('簽收', `請領 ${id} 簽收入庫，${ITEM[r.itemId].name}庫存 → ${st.qty} ${ITEM[r.itemId].unit}`, id, r.siteId);
  return true;
}
function receiveDonation(id){
  const d = S.donations.find(x => x.id === id);
  if(!d || d.status !== 'pending'){ toast('此筆捐贈已入庫'); return false; }
  d.status = 'received'; d.recvBy = ROLES[S.role].name;
  let st = stockOf(d.siteId, d.itemId);
  if(!st){ st = {siteId:d.siteId, itemId:d.itemId, qty:0, safety:5}; S.stock.push(st); }
  st.qty += d.qty;
  audit('捐贈入庫', `${d.donor}捐贈${ITEM[d.itemId].name} ${d.qty} ${ITEM[d.itemId].unit} 驗收入庫（庫存 ${st.qty}）`, id, d.siteId);
  return true;
}

/* 香積備餐 */
function saveMeal(sid, k){
  const m = (S.meals[sid] || []).find(x => x.k === k);
  if(!m){ toast('查無此餐次'); return false; }
  const p = $('#mp-' + k), pr = $('#mpr-' + k), sv = $('#msv-' + k);
  const num = el => { if(!el || el.value.trim() === '') return null; const v = parseInt(el.value, 10); return Number.isFinite(v) && v >= 0 ? v : NaN; };
  const planned = num(p), produced = num(pr), served = num(sv);
  if([planned, produced, served].some(v => Number.isNaN(v))){ toast('請輸入 0 以上的整數', 'crit'); return false; }
  if(planned !== null) m.planned = planned;
  if(produced !== null) m.produced = produced;
  if(served !== null){ m.served = served; m.done = true; }
  if(m.forecast == null) m.forecast = dinnerForecast(sid);
  audit('香積', `${m.name}備餐更新：計畫 ${m.planned ?? '—'}／產量 ${m.produced ?? '—'}／出餐 ${m.served ?? '—'}`, null, sid);
  return true;
}

function switchTab(t){
  if(!ROLES[S.role].tabs.includes(t)) { toast('目前角色無此模組權限', 'crit'); return; }
  S.tab = t; save(); renderShellBits(); renderView(); window.scrollTo({top:0});
}

function navButtons(mobile){
  return Object.keys(TABS).filter(t => ROLES[S.role].tabs.includes(t)).map(t => {
    const b = tabBadge(t);
    return `<button class="${S.tab === t ? 'on' : ''}" onclick="switchTab('${t}')">
      ${mobile ? '' : `<span class="nicon">${TABS[t].icon}</span>`}${TABS[t].name}
      ${b ? `<span class="badge">${b}</span>` : ''}</button>`;
  }).join('');
}
function rolePill(){
  return `<span class="role-pill">角色
    <select onchange="setRole(this.value)" aria-label="切換角色">
      ${Object.keys(ROLES).map(r => `<option value="${r}" ${S.role === r ? 'selected' : ''}>${ROLES[r].name}</option>`).join('')}
    </select></span>`;
}
function renderShellBits(){
  $('#sidebar').innerHTML = `
    <div class="brand"><span class="zh">安身</span><span class="en">AnShen · Shelter Ops</span></div>
    <div class="brand-sub">慈濟大型災害收容安置管理</div>
    ${rolePill()}
    <div class="mini-note" style="padding:0 8px">${esc(ROLES[S.role].org)}</div>
    <nav class="side-nav">${navButtons(false)}</nav>
    <div class="side-foot">安身・安心・安生<br>平時整備，災時啟用<br><span style="opacity:.7">演示原型 v1｜資料皆為虛構</span></div>`;
  $('#topbar').innerHTML = `
    <div class="topbar-row">
      <span class="zh">安身</span><span class="mini-note">收容安置管理</span>
      <span style="flex:1"></span>${rolePill()}
    </div>
    <nav class="tab-rail">${navButtons(true)}</nav>`;
  const e = S.event;
  $('#eventStrip').innerHTML = `
    <span class="dot crit"></span><span class="ev-name">${esc(e.name)}（${e.mag}）</span>
    <span class="lv">${esc(e.level)}</span>
    <span class="mini-note" style="color:var(--ink3)">啟動 ${e.started}</span>
    <span class="spacer"></span>
    <label class="mini-note" style="color:var(--ink3)">據點
      <select onchange="setSite(this.value)" style="margin-left:4px;background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:4px 6px;font-size:12.5px">
        ${S.sites.map(s => `<option value="${s.id}" ${S.site === s.id ? 'selected' : ''}>${s.short}｜${SITE_STATUS[s.status].t}</option>`).join('')}
      </select></label>
    <button class="btn sec sm" onclick="cycleTheme()">${themeLabel()}</button>
    <button class="btn sec sm" onclick="resetData()">重置演示</button>`;
}
/* ================================================================
   視圖層（一）：儀表板／據點與空間／報到與住民＋連動摘要
   ================================================================ */
const footHTML = () => `
  <div class="foot"><b>安身・安心・安生</b>——先安身（空間床位），再安心（關懷膚慰），後安生（生活重建追蹤）。<br>
  本頁為 vibe coding 演示原型：人物、據點狀態與數據皆為虛構，資料僅存於本機瀏覽器（localStorage）。</div>`;

function pageHead(title, sub, actions=''){
  return `<div class="page-head"><h1>${title}</h1><span class="sub">${sub}</span>
    ${actions ? `<span class="actions">${actions}</span>` : ''}</div>`;
}
function meterHTML(occ, cap){
  const pct = cap ? Math.min(100, Math.round(occ / cap * 100)) : 0;
  const cls = pct >= 90 ? 'crit' : pct >= 75 ? 'warn' : '';
  return `<div class="meter ${cls}" role="img" aria-label="使用率 ${pct}%"><i style="width:${pct}%"></i></div>`;
}
function gotoSite(sid, tab){ S.site = sid; switchTab(tab); }
function gotoReqs(sid){ UI.supTab = 'reqs'; gotoSite(sid, 'supplies'); }

/* ---------- 總覽儀表板 ---------- */
function vDash(){
  const open = openSites();
  const totalIn  = open.reduce((n,s) => n + occSite(s.id), 0);
  const totalCap = open.reduce((n,s) => n + capSite(s.id), 0);
  const lows = lowStock();
  const crits = lows.filter(r => stockCls(r) === 'crit');
  const todo = todoCount();
  const dinnerAll = open.reduce((n,s) => n + dinnerForecast(s.id), 0);

  const signals = `
    <div class="alert-strip">
      <button class="signal ${crits.length ? 'crit' : 'ok'}" onclick="switchTab('${ROLES[S.role].tabs.includes('supplies') ? 'supplies' : 'dash'}')">
        <span class="n">${crits.length}</span><span class="t">緊急庫存品項<br>（低於半數安全量）</span></button>
      <button class="signal ${lows.length ? 'warn' : 'ok'}" onclick="switchTab('${ROLES[S.role].tabs.includes('supplies') ? 'supplies' : 'dash'}')">
        <span class="n">${lows.length}</span><span class="t">偏低庫存品項<br>（低於安全庫存）</span></button>
      <button class="signal ${todo ? 'warn' : 'ok'}">
        <span class="n">${todo}</span><span class="t">我的待辦<br>（${esc(ROLES[S.role].name)}）</span></button>
      <button class="signal ok" onclick="switchTab('sites')">
        <span class="n">${open.length}<small style="font-size:13px;color:var(--ink3)">/${S.sites.length}</small></span>
        <span class="t">據點運作中<br>收容 ${totalIn} 人</span></button>
    </div>`;

  const stats = `
    <div class="grid g4">
      <div class="card stat"><span class="k">收容中人數（全據點）</span><span class="v">${totalIn}<small>人</small></span><span class="d">容量 ${totalCap} 床・使用率 ${totalCap ? Math.round(totalIn/totalCap*100) : 0}%</span></div>
      <div class="card stat"><span class="k">在住戶數</span><span class="v">${S.households.filter(h => h.status === 'in').length}<small>戶</small></span><span class="d">已退住 ${S.households.filter(h => h.status === 'out').length} 戶（${followList().length} 戶轉社區追蹤）</span></div>
      <div class="card stat"><span class="k">今晚餐食預估（香積）</span><span class="v">${dinnerAll}<small>份</small></span><span class="d">住民＋駐點志工，隨報到即時連動</span></div>
      <div class="card stat"><span class="k">庫存警示</span><span class="v" style="color:${lows.length ? 'var(--warn)' : 'var(--ok)'}">${lows.length}<small>項</small></span><span class="d">${crits.length ? `含 ${crits.length} 項緊急` : '無緊急缺口'}</span></div>
    </div>`;

  const siteCards = `<div class="grid gauto">` + S.sites.map(s => {
    const st = SITE_STATUS[s.status];
    const occ = occSite(s.id), cap = capSite(s.id);
    let act = '';
    if(s.status === 'applying') act = `<button class="btn pri sm${lk('site.approveOpen')}" onclick="onApproveOpen('${s.id}')">核准開設</button>`;
    if(s.status === 'standby')  act = `<button class="btn sec sm${lk('site.applyOpen')}" onclick="onApplyOpen('${s.id}')">申請開設</button>`;
    return `<div class="card">
      <h3>${esc(s.name)}<span class="chip ${st.cls}" style="margin-left:auto">${st.t}</span></h3>
      <div class="meter-row"><span class="lab">收容 ${occ}/${cap || '—'}</span>${meterHTML(occ, cap)}<span class="val">${cap ? Math.round(occ/(cap||1)*100) + '%' : ''}</span></div>
      <div style="font-size:12.5px;color:var(--ink3);margin-top:8px">
        指揮：${esc(s.cmdr)}・志工 ${s.volunteers} 人${s.openedAt ? `・${s.openedAt} 開設` : s.applyAt ? `・${s.applyAt} 申請` : ''}</div>
      <div style="margin-top:9px;display:flex;gap:7px">
        <button class="btn sec sm" onclick="gotoSite('${s.id}','sites')">空間配置</button>${act}</div>
    </div>`;
  }).join('') + `</div>`;

  /* 待辦（依角色） */
  const todos = [];
  if(S.role === 'hq'){
    S.sites.filter(s => s.status === 'applying').forEach(s =>
      todos.push({t:`核准據點開設：${s.name}`, d:s.applyNote, b:`onApproveOpen('${s.id}')`, bl:'核准'}));
    pendingReqsFor().forEach(r =>
      todos.push({t:`核准請領 ${r.id}：${ITEM[r.itemId].name} ${r.qty} ${ITEM[r.itemId].unit}${r.cross ? '（跨據點）' : ''}`, d:r.reason, b:`gotoReqs('${r.siteId}')`, bl:'查看'}));
  }
  if(S.role === 'cmd') pendingReqsFor().forEach(r =>
    todos.push({t:`核准請領 ${r.id}：${ITEM[r.itemId].name} ${r.qty} ${ITEM[r.itemId].unit}`, d:r.reason, b:`gotoReqs('${r.siteId}')`, bl:'查看'}));
  if(S.role === 'supply'){
    S.reqs.filter(r => r.status === 'approved').forEach(r =>
      todos.push({t:`出庫：${r.id} ${ITEM[r.itemId].name} ${r.qty} ${ITEM[r.itemId].unit} → ${siteOf(r.siteId).short}`, d:'已核准，待總倉出庫', b:`gotoReqs('${r.siteId}')`, bl:'處理'}));
    S.reqs.filter(r => r.status === 'issued').forEach(r =>
      todos.push({t:`待簽收：${r.id}（配送中）`, d:'到貨後簽收入庫', b:`gotoReqs('${r.siteId}')`, bl:'處理'}));
    S.donations.filter(d => d.status === 'pending').forEach(d =>
      todos.push({t:`捐贈驗收：${d.donor} ${ITEM[d.itemId].name} ${d.qty} ${ITEM[d.itemId].unit}`, d:d.note || '', b:`UI.supTab='donate';gotoSite('${d.siteId}','supplies')`, bl:'驗收'}));
  }
  if(S.role === 'kitchen') openSites().forEach(s => {
    if((S.meals[s.id] || []).some(m => !m.done && m.planned == null))
      todos.push({t:`${s.short}晚餐尚未排定備餐量（預估 ${dinnerForecast(s.id)} 份）`, d:'依在住人數自動預估，請填備餐計畫', b:`gotoSite('${s.id}','meals')`, bl:'排定'});
  });
  if(S.role === 'care' || S.role === 'med') S.careLogs.filter(l => l.followUp).slice(0,4).forEach(l => {
    const h = S.households.find(x => x.id === l.hhId);
    todos.push({t:`追蹤：${h ? h.head + '戶' : l.hhId}（${l.type}）`, d:l.note.slice(0, 32) + '…', b:`UI.careTab='follow';switchTab('care')`, bl:'查看'});
  });
  if(S.role === 'reg') todos.push({t:'受理報到登記（現場排隊由協力志工引導）', d:'以戶為單位建檔，系統自動連動空間／餐食／物資', b:`switchTab('intake')`, bl:'開始報到'});

  const todoCard = `<div class="card"><h3>待辦事項<span class="chip mut" style="margin-left:auto">${esc(ROLES[S.role].name)}視角</span></h3>
    ${todos.length ? `<div class="item-list">` + todos.map(x => `
      <div class="item" style="box-shadow:none"><div class="row1"><span class="ttl" style="font-size:13.5px">${esc(x.t)}</span>
        <span class="right"><button class="btn pri sm" onclick="${x.b}">${x.bl}</button></span></div>
        ${x.d ? `<div class="meta">${esc(x.d)}</div>` : ''}</div>`).join('') + `</div>`
      : `<div class="empty">目前無待辦，感恩 🙏</div>`}</div>`;

  const lowCard = `<div class="card"><h3>庫存警示（全據點）</h3>
    ${lows.length ? `<div class="item-list">` + lows.map(r => `
      <div class="meter-row" style="margin:5px 0"><span class="lab">${siteOf(r.siteId).short}｜${ITEM[r.itemId].name}</span>
        ${meterHTML(r.qty, r.safety * 2)}
        <span class="val">${r.qty}/${r.safety}</span>
        <span class="chip ${stockCls(r)}">${stockCls(r) === 'crit' ? '緊急' : '偏低'}</span></div>`).join('') + `</div>
      <div class="fnote">量表刻度＝安全庫存×2；低於安全庫存即警示，並於請領單建議補量。</div>`
      : `<div class="empty">各據點庫存均在安全水位以上</div>`}</div>`;

  const dc = dietCounts(S.site);
  const dietCard = `<div class="card"><h3>特殊餐彙總<span class="chip mut" style="margin-left:auto">${esc(siteOf(S.site).short)}據點</span></h3>
    ${['diabetic','soft','infant','allergy'].map(k => `
      <div class="meter-row" style="margin:6px 0"><span class="lab">${DIETS[k]}</span>
        <div class="meter"><i style="width:${Math.min(100, dc[k] * 12)}%;background:${DIET_COLORS[k]}"></i></div>
        <span class="val">${dc[k]} 份</span></div>`).join('')}
    <div class="fnote">依住民飲食註記即時彙總，香積組備餐頁同步。全餐皆為素食。</div></div>`;

  const seen = S.role === 'hq' ? S.audit : S.audit.filter(a => a.siteId === S.site || a.role === S.role || !a.siteId);
  const auditCard = `<div class="card"><h3>最新稽核軌跡${S.role === 'hq' ? '（全域）' : '（本據點）'}</h3>
    <ul class="tl">` + seen.slice(-7).reverse().map(a => `
      <li><span class="t">${a.at}・${ROLES[a.role] ? ROLES[a.role].name : a.role}</span><br>
        <span class="chip ${a.action === '越權攔截' ? 'crit' : a.action === '警示' ? 'warn' : 'mut'}" style="margin:2px 6px 2px 0">${esc(a.action)}</span>${esc(a.detail)}</li>`).join('') + `</ul></div>`;

  return pageHead('總覽儀表板', `${esc(S.event.name)}・依「${esc(ROLES[S.role].name)}」視角顯示`) +
    signals + stats + siteCards +
    `<div class="grid g2">${todoCard}${lowCard}</div>` +
    `<div class="grid g2">${dietCard}${auditCard}</div>`;
}

/* ---------- 據點與空間 ---------- */
function onApplyOpen(sid){
  if(!guard('site.applyOpen', '申請開設據點')) return;
  if(applyOpen(sid)){ commit(); toast('開設申請已送出，待總指揮中心核准', 'ok'); }
}
function onApproveOpen(sid){
  if(!guard('site.approveOpen', '核准據點開設')) return;
  if(approveOpen(sid)){ commit(); toast(`已核准 ${siteOf(sid).name} 開設——狀態轉為運作中`, 'ok'); }
}
function onToggleCheck(sid, idx){
  if(!guard('space.toggleCheck', '整備檢核表勾選')) return;
  if(toggleCheck(sid, idx)) commit();
}
function vSites(){
  const s = siteOf(S.site);
  const st = SITE_STATUS[s.status];
  const strip = `<div class="alert-strip">` + S.sites.map(x => `
    <button class="signal ${x.status === 'open' ? 'ok' : x.status === 'applying' ? 'warn' : ''}" onclick="setSite('${x.id}')" style="${x.id === S.site ? 'outline:2px solid var(--navy);' : ''}">
      <span class="dot ${x.status === 'open' ? 'ok' : x.status === 'applying' ? 'warn' : 'mut'}"></span>
      <span class="t"><b style="font-size:13px;color:var(--ink)">${esc(x.short)}</b><br>${SITE_STATUS[x.status].t}・${occSite(x.id)} 人</span></button>`).join('') + `</div>`;

  let statusCard = '';
  if(s.status === 'applying') statusCard = `<div class="card" style="border-left:4px solid var(--warn)">
    <h3>開設申請待核准</h3><div class="meta" style="font-size:13px;color:var(--ink2)">${esc(s.applyNote || '')}（${s.applyAt} 送出）</div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button class="btn pri${lk('site.approveOpen')}" onclick="onApproveOpen('${s.id}')">核准開設</button>
      <span class="chip warn">核准鏈：據點指揮 → 總指揮中心</span></div></div>`;
  if(s.status === 'standby') statusCard = `<div class="card" style="border-left:4px solid var(--ink3)">
    <h3>平時待命中</h3><div class="meta" style="font-size:13px;color:var(--ink2)">平時整備到位，災時才能一鍵開設——空間建檔與檢核由總務處（空間組）平日維護。</div>
    <div style="margin-top:10px"><button class="btn pri${lk('site.applyOpen')}" onclick="onApplyOpen('${s.id}')">申請開設</button></div></div>`;

  const housing = spacesOf(s.id).filter(p => p.cap);
  const service = spacesOf(s.id).filter(p => !p.cap);
  const spacesTable = `<div class="card"><h3>收容分區配置</h3><div class="tbl-wrap" style="box-shadow:none;border-radius:var(--r-sm)"><table>
    <thead><tr><th>空間</th><th>樓層</th><th>分區</th><th class="num">容量</th><th class="num">在住</th><th style="min-width:110px">使用率</th><th class="num">剩餘</th></tr></thead>
    <tbody>` + housing.map(p => {
      const occ = occSpace(p.id), remain = p.cap - occ;
      return `<tr><td><b>${esc(p.name)}</b></td><td>${p.floor}</td><td><span class="zone-tag">${esc(p.zone)}</span></td>
        <td class="num">${p.cap}</td><td class="num">${occ}</td><td>${meterHTML(occ, p.cap)}</td>
        <td class="num" style="color:${remain === 0 ? 'var(--crit)' : remain <= 4 ? 'var(--warn)' : 'var(--ink)'}">${remain} 床</td></tr>`;
    }).join('') + `</tbody></table></div>
    ${service.length ? `<div class="fnote" style="margin-top:10px">服務空間：${service.map(p => `${esc(p.name)}（${p.floor}）`).join('・')}</div>` : ''}</div>`;

  let checkCard = '';
  const cl = S.checklists[s.id];
  if(cl){
    const done = cl.filter(x => x.done).length;
    checkCard = `<div class="card"><h3>平時整備檢核表<span class="chip ${done === cl.length ? 'ok' : 'warn'}" style="margin-left:auto">${done}/${cl.length} 完成</span></h3>
      <ul class="check-list">` + cl.map((x,i) => `
        <li class="${x.done ? 'done' : ''}"><button class="cbx${lk('space.toggleCheck')}" onclick="onToggleCheck('${s.id}',${i})" aria-label="切換">${x.done ? '✓' : ''}</button>${esc(x.t)}</li>`).join('') + `</ul>
      <div class="fnote">回應「總務處量能」痛點：平時就把空間、消防、設備、床毯盤點建檔，開設申請時檢核表即為佐證。勾選權限：空間組。</div></div>`;
  }

  const info = `<div class="card"><h3>據點資訊</h3>
    <div class="meta" style="font-size:13.5px;color:var(--ink2);line-height:2">
      狀態：<span class="chip ${st.cls}">${st.t}</span>　據點指揮：${esc(s.cmdr)}<br>
      位置：${esc(s.addr)}　駐點志工：${s.volunteers} 人<br>
      收容：${occSite(s.id)} 人／容量 ${capSite(s.id)} 床${s.openedAt ? `　開設時間：${s.openedAt}` : ''}</div></div>`;

  return pageHead('據點與空間', '樓層分區・容量占用・平時整備') + strip + statusCard +
    `<div class="grid g2">${info}${checkCard || `<div class="card"><h3>整備檢核</h3><div class="empty">運作中據點之整備已於開設時完成檢核</div></div>`}</div>` +
    spacesTable;
}

/* ---------- 報到與住民 ---------- */
function vIntake(){
  const s = siteOf(S.site);
  const inList = hhIn(S.site);
  const outList = S.households.filter(h => h.siteId === S.site && h.status === 'out');
  const sub = `<div class="subtabs">
    <button class="${UI.intakeTab === 'reg' ? 'on' : ''}" onclick="UI.intakeTab='reg';renderView()">報到登記</button>
    <button class="${UI.intakeTab === 'list' ? 'on' : ''}" onclick="UI.intakeTab='list';renderView()">住民清單<span class="cnt">${inList.length} 戶</span></button>
    <button class="${UI.intakeTab === 'out' ? 'on' : ''}" onclick="UI.intakeTab='out';renderView()">已退住<span class="cnt">${outList.length} 戶</span></button>
  </div>`;
  let body = '';
  if(UI.intakeTab === 'reg') body = intakeForm(s);
  if(UI.intakeTab === 'list') body = hhListHTML(inList);
  if(UI.intakeTab === 'out') body = hhOutHTML(outList);
  return pageHead('報到與住民', `${esc(s.name)}・以「戶」為單位收容`) + sub + body;
}
function intakeForm(s){
  const housing = spacesOf(s.id).filter(p => p.cap);
  const steps = `<div class="steps">
    <div class="step on" data-n="1">報到建檔</div><div class="step" data-n="2">健康篩檢</div>
    <div class="step" data-n="3">分區配位</div><div class="step" data-n="4">安置完成</div></div>`;
  if(s.status !== 'open') return steps + `<div class="empty">本據點目前為「${SITE_STATUS[s.status].t}」，尚未開放收容報到。</div>`;
  return steps + `<div class="card">
    <h3>戶長資料</h3>
    <div class="frow">
      <div class="field"><label>戶長姓名 *</label><input id="f-head" placeholder="例：王小明"></div>
      <div class="field"><label>身分證號（遮罩填寫）</label><input id="f-idm" placeholder="A12***4567"><span class="hint">個資最小化：僅存遮罩，用於重複報到查核</span></div>
      <div class="field"><label>聯絡電話</label><input id="f-phone" placeholder="0912-***-345"></div>
      <div class="field"><label>原居地址／受損情形</label><input id="f-addr" placeholder="例：板橋區文化路（紅單）"></div>
    </div>

function submitIntake(){
  if(!guard('intake.register', '收容報到登記')) return;
  const head = $('#f-head').value.trim();
  if(!head){ toast('請填寫戶長姓名', 'crit'); $('#f-head').focus(); return; }
  const members = $$('.mrow').map(r => ({
    name: $('.m-name', r).value.trim(),
    age: parseInt($('.m-age', r).value, 10) || 0,
    sex: $('.m-sex', r).value,
    diet: $('.m-diet', r).value,
    needs: $$('.m-need', r).filter(c => c.checked).map(c => c.value),
  })).filter(m => m.name);
  if(members.length < 1){ toast('每戶至少需登記 1 位成員（請填成員姓名）', 'crit'); return; }
  const res = registerHousehold({ head, idm: $('#f-idm').value.trim(), phone: $('#f-phone').value.trim(),
    addr: $('#f-addr').value.trim(), spaceId: $('#f-space').value, members });
  if(!res.ok){ toast(res.msg, 'crit'); return; }
  commit();               // 單次 commit：六處已一次改完
  openRipple(res);        // money shot：連動摘要
}
/* 連動摘要（一次報到，六處連動） */
function openRipple(r){
  const st = iid => stockOf(r.sid, iid);
  const dietTxt = r.diets.length ? r.diets.map(m => DIETS[m.diet]).join('、') + ' 各+1' : '無特殊餐';
  const bubbles = [
    {i:'⌂', k:`空間占用｜${esc(r.sp.name)}`, v:`${r.before.spOcc} → ${r.before.spOcc + r.n}`, cls:'up'},
    {i:'☕', k:`今晚餐食預估（香積）<br>${dietTxt}`, v:`${r.before.dinner} → ${dinnerForecast(r.sid)}`, cls:'up'},
    ...['bed','blanket','kit'].map(iid => {
      const s2 = st(iid), low = s2 && s2.qty < s2.safety;
      return {i:'▤', k:`${ITEM[iid].name}庫存${low ? '<br><b>已低於安全庫存！</b>' : ''}`,
        v:`−${r.reserved[iid]} → ${s2 ? s2.qty : 0}`, cls: low ? 'alert' : 'down'};
    }),
    {i:'✎', k:'稽核軌跡（誰・何時・做了什麼）', v:`+${S.audit.length - r.before.audit}`, cls:'up'},
  ];
  openModal(`
    <div class="ripple-house"><div class="hh">${esc(r.hh)}戶・${r.n} 口</div>
      <div class="hs">${r.id}｜已安置於 ${esc(r.sp.name)}（${esc(r.sp.zone)}）——一次報到，六處同步連動</div></div>
    <div class="ripple-grid">${bubbles.map((b,i) => `
      <div class="bubble ${b.cls}" style="animation-delay:${i * 90}ms">
        <div class="bi">${b.i}</div><div class="bv">${b.v}</div><div class="bk">${b.k}</div></div>`).join('')}</div>
    ${r.shortages.length ? `<div class="card" style="border-left:4px solid var(--crit);margin-top:12px;padding:10px 14px">
      <b style="color:var(--crit)">物資缺口</b>：${r.shortages.map(x => `${ITEM[x.iid].name}不足 ${x.gap} ${ITEM[x.iid].unit}`).join('、')}——已寫入稽核，請儘速請領。</div>` : ''}
    ${r.alerts.length ? `<div class="fnote" style="margin-top:10px">⚠ ${r.alerts.join('；')}</div>` : ''}
    <div class="macts"><button class="btn sec" onclick="closeModal();UI.intakeTab='list';renderView()">查看住民清單</button>
      <button class="btn pri" onclick="closeModal()">完成</button></div>`);
}

  if(!guard('care.log', '新增關懷紀錄')) return;

  return pageHead('個案關懷', `${esc(s.name)}・安心膚慰／醫療／轉介／追蹤`) + sub + body;

  const live = dinnerForecast(s.id);

  const mealCards = `<div class="grid g3">` + meals.map(m => {

        ${!m.done ? '<span class="d">隨報到／退住即時連動</span>' : ''}</div>
      ${m.done ? `
        <div class="meta" style="font-size:13px;color:var(--ink2);line-height:2">
          備餐計畫：${m.planned ?? '—'} 份　實際產量：${m.produced ?? '—'} 份<br>
          實際出餐：<b>${m.served}</b> 份　餘量：${m.produced != null && m.served != null ? m.produced - m.served : '—'} 份</div>`
      : `
        <div class="frow">
          <div class="field"><label>備餐計畫（份）</label><input id="mp-${m.k}" inputmode="numeric" value="${m.planned ?? ''}" placeholder="建議 ${Math.ceil(live * 1.08)}"></div>
          <div class="field"><label>實際產量</label><input id="mpr-${m.k}" inputmode="numeric" value="${m.produced ?? ''}"></div>
          <div class="field"><label>實際出餐</label><input id="msv-${m.k}" inputmode="numeric" value="${m.served ?? ''}"><span class="hint">填出餐即結餐</span></div>
        </div>
        <button class="btn pri sm${lk('meal.save')}" onclick="onSaveMeal('${s.id}','${m.k}')">儲存${m.name}備餐</button>`}
    </div>`;
  }).join('') + `</div>`;

  const vals = meals.map(m => ({name:m.name, f:(m.forecast != null ? m.forecast : live), sv:m.served}));
  const mx = Math.max(...vals.map(v => Math.max(v.f || 0, v.sv || 0)), 1);
  const chart = `<div class="card"><h3>今日三餐｜預估 vs 實際出餐</h3>
    <div class="bars">${vals.map(v => `
      <div class="bar" style="height:${Math.round((v.f || 0) / mx * 100)}%"><span class="bl">${v.f || 0}</span></div>
      <div class="bar b2" style="height:${Math.round((v.sv || 0) / mx * 100)}%"><span class="bl">${v.sv ?? '—'}</span></div>
      <div style="flex:.6"></div>`).join('')}</div>
    <div class="bars-x">${vals.map(v => `<span>${v.name}</span><span></span><span style="flex:.6"></span>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--c1)"></i>需求預估</span><span><i style="background:var(--c2)"></i>實際出餐</span></div></div>`;

  const dietCard = `<div class="card"><h3>特殊餐備製清單</h3>
    ${['diabetic','soft','infant','allergy'].map(k => `
      <div class="meter-row" style="margin:6px 0"><span class="lab">${DIETS[k]}</span>
        <div class="meter"><i style="width:${Math.min(100, dc[k] * 12)}%;background:${DIET_COLORS[k]}"></i></div>
        <span class="val">${dc[k]} 份</span></div>`).join('')}
    <div class="fnote">由報到健康篩檢自動彙總——香積組無須逐戶詢問。全餐素食（香積飯為後備糧）。</div></div>`;

  const tmr = `<div class="card"><h3>明日預估</h3>
    <div class="stat"><span class="k">早齋預估（依現時在住）</span><span class="v">${live}<small>份</small></span>
    <span class="d">在住 ${occSite(s.id)} 人＋志工 ${s.volunteers} 人；夜間新報到將自動上修</span></div>
    <div class="fnote" style="margin-top:8px">備量建議 +8%（含臨時支援與熱食外送鄰近未收容戶）。</div></div>`;

  return pageHead('香積餐食', `${esc(s.name)}・齋堂供餐（全素）`) + mealCards +
    `<div class="grid g3">${chart}${dietCard}${tmr}</div>`;
}

/* ---------- 物資設備 ---------- */
function onApproveReq(id){ if(!guard('req.approve', '核准物資請領')) return; if(approveReq(id)){ commit(); toast('已核准，移交物資組出庫', 'ok'); } }
function onRejectReq(id){ if(!guard('req.approve', '駁回物資請領')) return; if(rejectReq(id)){ commit(); toast('已駁回'); } }
function onIssueReq(id){ if(!guard('req.issue', '物資出庫')) return; if(issueReq(id)){ commit(); toast('已出庫，配送中', 'ok'); } }
function onReceiveReq(id){ if(!guard('req.receive', '到貨簽收')) return; if(receiveReq(id)){ commit(); toast('已簽收入庫，庫存同步更新', 'ok'); } }
function onReceiveDonation(id){ if(!guard('donate.receive', '捐贈驗收入庫')) return; if(receiveDonation(id)){ commit(); toast('捐贈已驗收入庫（依規徵信）', 'ok'); } }
function quickReq(iid){ UI.reqItem = iid; UI.supTab = 'reqs'; renderView(); window.scrollTo({top:0}); }
function submitReq(){
  if(!guard('req.create', '建立物資請領')) return;
  const itemId = $('#rq-item').value, qty = parseInt($('#rq-qty').value, 10);
  const cross = $('#rq-cross').checked, from = $('#rq-from').value.trim(), reason = $('#rq-reason').value.trim();
  if(!Number.isFinite(qty) || qty < 1){ toast('數量需為 1 以上的整數', 'crit'); return; }
  if(!reason){ toast('請填寫請領事由（供核准判斷）', 'crit'); return; }
  if(cross && !from){ toast('跨據點調撥請填來源據點', 'crit'); return; }
  const id = createReq({itemId, qty, cross, from, reason});
  UI.reqItem = '';
  commit();
  toast(`請領單 ${id} 已送出${cross ? '——跨據點調撥需總指揮中心核准' : '——待據點指揮核准'}`, 'ok');
}
function reqSteps(r){
  if(r.status === 'rejected') return `<span class="chip crit">已駁回</span>`;
  const idx = {pending:1, approved:2, issued:3, received:4}[r.status];
  const names = ['申請', '核准', '出庫', '簽收'];
  return `<div class="steps" style="margin:10px 0 2px;max-width:420px">` + names.map((nm,i) => `
    <div class="step ${i < idx ? 'done' : i === idx ? 'on' : ''}" data-n="${i + 1}">${nm}</div>`).join('') + `</div>`;
}

      rows.map(r => `<tr><td><b>${ITEM[r.itemId].name}</b><span class="mini-note" style="color:var(--ink3)">（${ITEM[r.itemId].unit}）</span></td>

      ${equip.length ? `<div class="card" style="margin-top:14px"><h3>設備</h3><div class="checks" style="gap:10px">` +

  if(UI.supTab === 'reqs'){
    const form = `<div class="card"><h3>建立請領單</h3>
      <div class="frow">
        <div class="field"><label>品項 *</label><select id="rq-item">
          ${ITEMS.filter(i => !i.equip).map(i => `<option value="${i.id}" ${UI.reqItem === i.id ? 'selected' : ''}>${i.name}（${i.unit}）</option>`).join('')}</select></div>

          <span class="hint">跨據點調撥需總指揮中心核准</span></div>
      </div>
      ${'' /* rq-from 一律存在，避免未勾選時查無元素 */}
      <div class="field"><label>事由 *</label><textarea id="rq-reason" rows="2" placeholder="例：夜間低溫，毛毯接近安全庫存"></textarea></div>
      <button class="btn pri${lk('req.create')}" onclick="submitReq()">送出請領</button></div>`;
    body = form + `<div style="height:14px"></div><div class="item-list">` + (reqs.length ? reqs.map(r => `
      <div class="item"><div class="row1">
        <span class="ttl">${r.id}</span>

        ${r.cross ? '<span class="chip warn">跨據點調撥</span>' : ''}
        <span class="right mini-note" style="color:var(--ink3)">${siteOf(r.siteId).short}｜${r.at}</span></div>
      <div class="meta"><b>${ITEM[r.itemId].name} ${r.qty} ${ITEM[r.itemId].unit}</b>${r.from ? `・來源：${esc(r.from)}` : ''}・${esc(r.reason)}<br>申請：${esc(r.byName)}${r.apprBy ? `・核准：${esc(r.apprBy)}` : ''}</div>

  }
  if(UI.supTab === 'donate'){
    body = `<div class="item-list">` + (dons.length ? dons.map(d => `

  return pageHead('物資設備', `${esc(s.name)}・庫存／請領／捐贈`) + sub + body;

    <thead><tr><th>角色＼模組</th>${Object.keys(TABS).map(t => `<th>${TAB_SHORT[t]}</th>`).join('')}</tr></thead><tbody>` +
    Object.keys(ROLES).map(r => `<tr><td class="rl">${ROLES[r].name}</td>` +
      Object.keys(TABS).map(t => `<td class="${ROLES[r].tabs.includes(t) ? 'y' : 'n'}">${ROLES[r].tabs.includes(t) ? '●' : '—'}</td>`).join('') + `</tr>`).join('') +
    `</tbody></table></div>`;
  const actTable = `<div class="matrix-wrap"><table class="matrix" style="min-width:480px">
    <thead><tr><th style="text-align:left">關鍵動作</th><th style="text-align:left">授權角色（其餘一律攔截＋稽核）</th></tr></thead><tbody>` +
    Object.keys(PERM).map(a => `<tr><td class="rl">${ACTION_LABELS[a] || a}</td>
      <td style="text-align:left">${PERM[a].map(r => ROLES[r].name).join('・')}</td></tr>`).join('') + `</tbody></table></div>`;
  const raci = `<div class="matrix-wrap"><table class="matrix" style="min-width:560px">
    <thead><tr><th>步驟</th><th>R 負責</th><th>A 核准</th><th>C 諮詢</th><th>I 通知</th></tr></thead><tbody>
    <tr><td class="rl">災情通報</td><td>社區志工（協力）</td><td>據點指揮</td><td>—</td><td>總指揮中心</td></tr>
    <tr><td class="rl">開設申請</td><td>據點指揮</td><td>總指揮中心</td><td>空間組（總務）</td><td>全體功能組</td></tr>
    <tr><td class="rl">收容報到</td><td>報到組</td><td>據點指揮</td><td>醫療組（人醫會）</td><td>香積組・物資組</td></tr>
    <tr><td class="rl">物資調度</td><td>物資組</td><td>據點指揮／總指揮</td><td>香積組</td><td>據點全體</td></tr>
    <tr><td class="rl">退住追蹤</td><td>關懷組</td><td>據點指揮</td><td>醫療組</td><td>社區訪視志工</td></tr>
    </tbody></table></div>`;
  const pf = `<div class="crumb">權限流 AUTHORIZATION FLOW</div>
    <div class="flow-box"><b style="font-size:13.5px">模組可見矩陣（由系統權限表即時生成，與實際行為一致）</b>${visMatrix}</div>
    <div class="flow-box"><b style="font-size:13.5px">關鍵動作授權表</b>${actTable}
      <div class="fnote">越權點擊不是「按鈕消失」而是<b>攔截＋提示＋寫入稽核</b>——演示時可實際點擊 🔒 按鈕觀察。</div></div>
    <div class="flow-box"><b style="font-size:13.5px">核准鏈</b>
      ${flowLine([{t:'據點指揮',s:'開設申請'},{t:'總指揮中心',s:'核准開設',c:'hot'}])}
      <div style="height:8px"></div>
      ${flowLine([{t:'功能組',s:'請領申請'},{t:'據點指揮',s:'本據點核准'},{t:'總指揮中心',s:'跨據點加核',c:'hot'},{t:'物資組',s:'出庫'},{t:'申請單位',s:'簽收',c:'okn'}])}</div>
    <div class="flow-box"><b style="font-size:13.5px">開設流程 RACI</b>${raci}</div>`;

  const demo = `<div class="crumb">演示動線（3 分鐘）</div>
    <div class="card"><ol style="padding-left:20px;line-height:2.1;font-size:14px">
      <li>以「<b>總指揮中心</b>」看儀表板：警示燈號、待核事項（關渡開設申請）——<b>權限流</b>的視角差異。</li>
      <li>切「<b>報到組</b>」→ 報到登記一戶 5 口（含糖尿病長者＋嬰兒）→ <b>六氣泡連動摘要</b>——<b>資訊流</b> money shot。</li>
      <li>毛毯跌破安全庫存 → 切「<b>空間組</b>」建立跨據點請領 → 切「<b>據點指揮</b>」點核准會被<b>攔截</b>（跨據點限總指揮）→ 切「<b>總指揮</b>」核准 → 「<b>物資組</b>」出庫 → 簽收——<b>工作流</b>全鏈。</li>
      <li>切「<b>總指揮</b>」核准關渡開設 → 據點狀態機轉「運作中」。</li>
      <li>「<b>報到組</b>」示範防呆：滿床拒報、重複證號攔截、退住二次確認。</li>
      <li>回本頁講三流架構；示範任意角色點 🔒 按鈕 → 攔截寫入稽核。</li></ol>
    <div class="fnote">重置演示資料：右上角「重置演示」→ 還原種子情境。</div></div>`;

  const notes = `<div class="card"><h3>設計前提與待確認</h3>
    <ul style="padding-left:18px;font-size:13px;color:var(--ink2);line-height:2">
      <li>退住物資回補規則：<b>福慧床回庫、毛毯／盥洗包（消耗品）不回補</b>——預設值，待實務裁決。</li>
      <li>個資最小化：證號僅存遮罩、電話遮碼；正式版應加驗證與加密存放。</li>
      <li>本原型單機離線可用（localStorage）；正式版建議中央資料庫＋離線同步（災時斷網常態）。</li>
      <li>所有人物、據點狀態、數據皆為虛構演示情境。</li></ul></div>`;

  return pageHead('制度說明', '三流架構・RACI・演示講稿') + intro + wf + inf + pf + demo + notes;
}

/* ================================================================
   Router 與啟動
   ================================================================ */
function renderView(){
  if(!ROLES[S.role].tabs.includes(S.tab)) S.tab = ROLES[S.role].home;
  const views = {dash:vDash, sites:vSites, intake:vIntake, care:vCare, meals:vMeals, supplies:vSupplies, staff:vStaff, about:vAbout};
  $('#view').innerHTML = (views[S.tab] || vDash)() + footHTML();
  const mr = $('#memberRows');            // 報到表單預帶一列成員，避免空表單卡住現場
  if(mr && !mr.children.length) addMemberRow();
}
(function boot(){
  if(!ROLES[S.role]) S.role = 'hq';
  if(!ROLES[S.role].tabs.includes(S.tab)) S.tab = ROLES[S.role].home;
  applyTheme();
  renderShellBits();
  renderView();
})();
</script>
</body>
</html>
