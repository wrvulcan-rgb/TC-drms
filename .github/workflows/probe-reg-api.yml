name: Probe registration API (privacy check, masked output)

on:
  push:
    branches: [claude/artifacts-privacy-scan-kixkrn]
    paths: [".github/workflows/probe-reg-api.yml"]
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump wrapper (guarded PII-free)
        shell: python
        run: |
          import re, urllib.request
          URL = "https://script.google.com/macros/s/AKfycbymV8F2XtPGeSUTupj8zOqY8P_p8hKjLLWsNnuy7dyj9YGID06wvqoWXJT8D-1WnHZS/exec"
          req = urllib.request.Request(URL, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              body = r.read().decode("utf-8", "replace")
              print("status:", r.status, "ctype:", r.headers.get("Content-Type"), "bytes:", len(body.encode()))
          # Guard: refuse to print if any PII shape sneaks in
          if re.search(r"09\d{8}", body) or len(re.findall(r"[一-鿿]", body)) > 8:
              print("PII SHAPE DETECTED — withholding raw."); raise SystemExit(0)
          print("----- RAW BODY -----")
          print(body)
