name: Build Tzu Chi manuscript corpus

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/tzuchi_corpus.py
      - scripts/manuscript_validate.py
      - tests/test_manuscript_validate.py
      - .github/workflows/tzuchi-corpus.yml
      - manuscript/**
      - '!manuscript/knowledge/generated/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tzuchi-manuscript-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -q --disable-pip-version-check jsonschema PyYAML

      - name: Validate source and volunteer intake contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/tzuchi_corpus.py scripts/manuscript_validate.py
          python -m unittest -v tests/test_manuscript_validate.py
          python scripts/manuscript_validate.py manuscript/examples/volunteer-report.sample.json --json
          python - <<'PY'
          import json
          from pathlib import Path

          import jsonschema
          import yaml

          schema = json.loads(Path("manuscript/schemas/volunteer-report.schema.json").read_text(encoding="utf-8"))
          sample = json.loads(Path("manuscript/examples/volunteer-report.sample.json").read_text(encoding="utf-8"))
          jsonschema.Draft202012Validator(schema, format_checker=jsonschema.FormatChecker()).validate(sample)
          rules = json.loads(Path("manuscript/validators/rules.json").read_text(encoding="utf-8"))
          terms = yaml.safe_load(Path("manuscript/knowledge/terminology.yaml").read_text(encoding="utf-8"))
          assert rules["publication_thresholds"]["human_approval_required"] is True
          assert len(terms["terms"]) >= 20
          print(json.dumps({"schema": "valid", "semantic_validator": "valid", "terminology_terms": len(terms["terms"])}, ensure_ascii=False))
          PY

  build-corpus:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install -q --disable-pip-version-check requests beautifulsoup4

      - name: Build verified 500-article corpus
        run: |
          python scripts/tzuchi_corpus.py \
            --target 500 \
            --max-categories 64 \
            --candidate-multiplier 2.8 \
            --output-dir manuscript/knowledge/generated

      - name: Verify corpus invariants
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("manuscript/knowledge/generated/corpus-manifest.jsonl")
          rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert len(rows) == 500, len(rows)
          assert len({row["url"] for row in rows}) == 500
          assert len({row["body_sha256"] for row in rows}) == 500
          assert all(row["date"] and row["author"] and row["char_count"] >= 320 for row in rows)
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          print(json.dumps({"rows": len(rows), "manifest_sha256": digest}, ensure_ascii=False))
          PY

      - name: Commit derived corpus artifacts
        run: |
          if [ -z "$(git status --porcelain -- manuscript/knowledge/generated)" ]; then
            echo "No generated changes"
            exit 0
          fi
          git status --short -- manuscript/knowledge/generated
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/knowledge/generated
          git commit -m "data: generate verified 500-article manuscript corpus"
          git push origin HEAD:"${TARGET_BRANCH}"
